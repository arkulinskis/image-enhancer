package_name: Image_Enhancer
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
scheduled_tasks:
- job_id: IEQTICK1
  task_name: enhancer_tick
  time_spec:
    at: {}
    every: minute
    n: 15
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: false, confirm_email: false, enable_automatically: true, remember_me_days: 30, require_secure_passwords: true, use_email: true, use_google: true}
  server_config:
    email_content:
      reset_password:
        html: |-
          <p>Hi there,</p>
          <p>You have requested a password reset for your account {{email}}. To reset your password, click the link below:</p>
          <p>{{reset_link}}</p>
          <p>This link will expire in ten minutes.</p>
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup: {module: startup, type: module}
uplink_visible: true
