metadata:
  description: 'Private image restyling API: your apps send a picture, your own PC repaints it in one of ten styles.'
  logo_img: asset:icon-512.png
  title: Image Enhancer
name: Image Enhancer
native_deps:
  head_html: |
    <script src="_/theme/legal-kit.js?v=8292c1a747"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#131211">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link id="ui-favicon" rel="icon" type="image/svg+xml" href="_/theme/icon.svg?v=ca290ba50b">
    <link rel="apple-touch-icon" href="_/theme/icon-180.png?v=9d5636c1af">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    </script>

    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="t792bny" data-button="false" data-label="Submit feedback" async></script>
    <link rel="stylesheet" href="_/theme/icons.css?v=ca13b50058">
    <link rel="stylesheet" href="_/theme/app.css?v=dcba749e93">
    <script src="_/theme/ie-kit.js?v=57dc128f5b"></script>
    <script src="_/theme/app-kit.js?v=9cfb4706a1"></script>
package_name: Image_Enhancer
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
scheduled_tasks:
- job_id: IEQTICK1
  task_name: enhancer_tick
  time_spec:
    at: {}
    every: minute
    n: 15
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup:
  module: startup
  type: module
