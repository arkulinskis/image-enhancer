    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Service", "@id": "https://image-enhancer.anvil.app/#app", "name": "Image Enhancer", "url": "https://image-enhancer.anvil.app/", "description": "A private service for Arkvital's apps: send a picture with a style and get it back repainted by an open image model on the owner's own PC.", "image": "https://image-enhancer.anvil.app/_/theme/og-image.png", "serviceType": "Your apps send a picture. Your PC repaints it.", "provider": {"@id": "https://arkvital.com/#org"}, "areaServed": "Worldwide", "availableChannel": {"@type": "ServiceChannel", "serviceUrl": "https://image-enhancer.anvil.app/", "name": "Web browser"}, "availableLanguage": "en", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "CAD"}, "audience": {"@type": "Audience", "audienceType": "Arkvital's own apps and their developer (a private service: apps need a key from the owner)"}}, {"@type": "WebSite", "@id": "https://image-enhancer.anvil.app/#site", "url": "https://image-enhancer.anvil.app/", "name": "Image Enhancer", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
