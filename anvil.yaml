metadata:
  description: "A private service for Arkvital's apps: send a picture with a style and get it back repainted by an open image model on the owner's own PC."
  logo_img: "asset:icon-512.png"
  title: "Image Enhancer: private picture-restyling API"
name: Image Enhancer
