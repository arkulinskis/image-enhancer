<div class="ie-problem-host">
  <div class="ie-problem">
    <div class="ie-problem-head">
      <a anvil:name="title_link" href="#home"><anvil-component type="Label" name="title" prop:role='["t"]'></anvil-component></a>
      <anvil-component type="Label" name="count" prop:role='["st", "st-failed"]'></anvil-component>
    </div>
    <anvil-component type="Label" name="steps" prop:role='["ie-fix-steps"]'></anvil-component>
    <anvil-component type="Label" name="latest" prop:role='["ie-meta", "mono"]'></anvil-component>
    <div class="ie-problem-btns">
      <anvil-component type="Button" name="retry_button" prop:text="Try these again" prop:role='["btn", "btn-sm", "ic-refresh"]' prop:visible="false"></anvil-component>
    </div>
  </div>
</div>
