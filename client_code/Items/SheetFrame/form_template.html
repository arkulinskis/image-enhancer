<div class="ie-sframe-host">
  <a class="ie-sframe" anvil:name="frame" href="#home">
    <span class="ie-sframe-pic ie-frame" anvil:name="pic">
      <img anvil:name="img" alt="" loading="lazy" width="400" height="300">
      <anvil-component type="Label" name="wait" prop:role='["ie-sframe-wait"]'></anvil-component>
    </span>
    <span class="ie-sframe-cap">
      <anvil-component type="Label" name="num" prop:role='["ie-sframe-num"]'></anvil-component>
      <anvil-component type="Label" name="label" prop:role='["t"]'></anvil-component>
      <anvil-component type="Label" name="note" prop:role='["ie-meta"]'></anvil-component>
    </span>
  </a>
</div>
